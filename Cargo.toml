[package]
name = "txplore"
version = "0.1.0"
edition = "2021"
authors = ["akshola00"]
description = "A powerful Bitcoin transaction explorer, script disassembler, and deep analyzer in Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
bitcoin = { version = "0.32", features = ["serde", "rand", "base64"] }
bitcoincore-rpc = "0.19"
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
ratatui = "0.28"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comfy-table = "7.1"
colored = "2.1"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
